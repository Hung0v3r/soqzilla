name: ci

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  indexer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - run: npm test

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # One fixed key, so every APK installs over the last. Without the secrets (forks) the APK is
      # debug-signed and will not update an installed Soqzilla.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SOQZILLA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SOQZILLA_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets: this APK is debug-signed and will not install over an existing Soqzilla."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=soqzilla\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/keystore.properties

      - name: Unit tests (Kotlin against the Node reference vectors)
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest

      - name: Build release APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Signing certificate
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | grep -E 'certificate (DN|SHA-256)'

      - uses: actions/upload-artifact@v4
        with:
          name: soqzilla-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports-${{ github.run_number }}
          path: android/app/build/reports/tests/
          retention-days: 7
